<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc"><title id="title">Andrés León | LIONS</title><desc id="desc">Desarrollador de software e integrador tecnológico. Software empresarial, automatización e IA aplicada. Un pequeño león pixelado corre y salta sobre LIONS.</desc><style>text{font-family:Consolas,'Liberation Mono',monospace}.small{font-size:15px;fill:#a6bac9}.body{font-size:20px;fill:#e7f0f5}.cyan{fill:#70e3e2}.amber{fill:#ffb45c}@media(prefers-reduced-motion:reduce){.pulse{animation:none!important}}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* Travel, leap and stride use separate groups so their transforms compose. */
.lion-travel{animation:lion-run 9s linear infinite}
.lion-leap{animation:lion-leap 9s linear infinite}
.lion-facing{transform-origin:28px 17px;animation:lion-facing 9s steps(1,end) infinite}
.lion-legs-a{animation:lion-stride-a .24s steps(1,end) infinite}
.lion-legs-b{opacity:0;animation:lion-stride-b .24s steps(1,end) infinite}
@keyframes lion-run{0%{transform:translateX(0)}45%,50%{transform:translateX(198px)}95%,100%{transform:translateX(0)}}
@keyframes lion-leap{0%,14%,34%,64%,84%,100%{transform:translateY(0)}19%,79%{transform:translateY(-20px)}24%,74%{transform:translateY(-30px)}29%,69%{transform:translateY(-20px)}}
@keyframes lion-facing{0%{transform:scaleX(1)}48%{transform:scaleX(-1)}98%{transform:scaleX(1)}}
@keyframes lion-stride-a{0%,100%{opacity:1}50%{opacity:0}}
@keyframes lion-stride-b{0%,100%{opacity:0}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.lion-travel,.lion-leap,.lion-facing,.lion-legs-a,.lion-legs-b{animation:none!important}.lion-legs-b{opacity:0}}
